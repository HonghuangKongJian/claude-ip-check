#:schema node_modules/wrangler/config-schema.json
#
# 公开模板配置 —— 这份是要提交到仓库、供别人一键部署用的。
# 不要在这里写任何个人域名 / 私有变量，否则别人 fork 后部署会失败。
# 个人化的配置放在 wrangler.local.toml（已在 .gitignore 中忽略）。

name = "claude-ip-check"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 保持 workers.dev 域名可用；绑定自定义域名后可不删，作为兜底入口
workers_dev = true

# 静态资源（前端页面）由 Worker 托管，run_worker_first=true 保证 /api/* 先走 Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
# 页头「返回门户」按钮指向的地址。内置固定值，部署时无需填写；如需更换可在此覆盖。
PORTAL_URL = "https://amw3.eu.org/"

# 分流一致性探测使用的额外主机名（逗号分隔）。留空则只使用当前域名。
# 例：DNS_TEST_HOSTS = "d1.example.com,d2.example.com"
DNS_TEST_HOSTS = ""

# 国旗图片 CDN 模板，{cc} 会替换为小写两位国家码
FLAG_CDN = "https://flagcdn.com/24x18/{cc}.png"

# ─────────────────────────────────────────────────────────────
# 可选：KV 缓存（强烈建议，跨 PoP 共享评分结果、显著降低回源）
# 创建：npx wrangler kv namespace create IP_KV
# 然后把返回的 id 填到这里，并取消注释
# ─────────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "IP_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ─────────────────────────────────────────────────────────────
# 自定义域名：改用控制台绑定，或用 wrangler.local.toml 单独声明。
# 切勿把个人域名写进这份文件——别人账号里没有你的 zone，会直接部署失败。
# ─────────────────────────────────────────────────────────────
