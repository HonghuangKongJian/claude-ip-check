#:schema node_modules/wrangler/config-schema.json
#
# 公开模板配置 —— 这份是要提交到仓库、供别人一键部署用的。
# 不要在这里写任何个人域名 / 私有变量，否则别人 fork 后部署会失败。
# 个人化的配置放在 wrangler.local.toml（已在 .gitignore 中忽略）。

name = "claude-ip-check"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 保持 workers.dev 域名可用；绑定自定义域名后可不删，作为兜底入口
workers_dev = true

# 静态资源（前端页面）由 Worker 托管，run_worker_first=true 保证 /api/* 先走 Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

# ─────────────────────────────────────────────────────────────
# 这里刻意不声明 [vars]。
#
# 原因：Deploy 按钮会把 wrangler 配置中声明的变量作为「待填项」呈现给
# 部署者。本项目所有配置都在 src/lib/config.js 内置了默认值，一键部署
# 无需填写任何内容，因此不在此声明。
#
# 需要定制时，在 Cloudflare 控制台
#   Worker → Settings → Variables and Secrets → Add
# 添加同名变量即可覆盖内置默认值，可选键：
#   PORTAL_URL       页头「返回门户」按钮地址
#   DNS_TEST_HOSTS   逗号分隔的额外探测主机名
#   FLAG_CDN         国旗图片模板，{cc} 为小写国家码
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# 可选：KV 缓存（强烈建议，跨 PoP 共享评分结果、显著降低回源）
# 创建：npx wrangler kv namespace create IP_KV
# 然后把返回的 id 填到这里，并取消注释
# ─────────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "IP_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ─────────────────────────────────────────────────────────────
# 自定义域名：改用控制台绑定，或用 wrangler.local.toml 单独声明。
# 切勿把个人域名写进这份文件——别人账号里没有你的 zone，会直接部署失败。
# ─────────────────────────────────────────────────────────────
